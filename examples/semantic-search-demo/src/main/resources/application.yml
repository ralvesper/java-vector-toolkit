server:
  port: 8080

vector:
  store:
    provider: in-memory

  # Example for Pinecone:
  # store:
  #   provider: pinecone
  # pinecone:
  #   api-key: ${PINECONE_API_KEY}
  #   host: ${PINECONE_HOST}

  chunking:
    size: 800
    overlap: 100
  search:
    top-k: 5

  embedding:
    # hashing (default, offline) | ollama (needs vector.embedding.model)
    provider: ${EMBEDDING_PROVIDER:hashing}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${EMBEDDING_MODEL:nomic-embed-text}

  llm:
    # none (default, retrieval-only fallback) | gemini | ollama
    provider: ${LLM_PROVIDER:none}
    api-key: ${GEMINI_API_KEY:}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${LLM_MODEL:gemini-2.5-flash}
